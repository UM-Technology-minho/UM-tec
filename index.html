<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - UM Technology</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    #loginForm, #adminPanel {
      background: #1e1e1e;
      padding: 2em;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      width: 320px;
      text-align: center;
      z-index: 1;
      max-width: 100%;
    }

    h2 {
      color: #00bcd4;
      margin-bottom: 1.5em;
      font-size: 2em;
    }

    input {
      padding: 0.8em;
      width: 100%;
      margin: 0.5em 0;
      font-size: 1em;
      background: #333;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
    }

    input:focus {
      outline: none;
      border-color: #00bcd4;
    }

    button {
      background: #00bcd4;
      color: white;
      padding: 0.8em;
      border: none;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1em;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #008c96;
    }

    #error {
      color: red;
      margin-top: 1em;
      font-size: 0.9em;
    }

    .footer {
      font-size: 0.8em;
      margin-top: 1.5em;
      color: #777;
    }

    /* Admin Panel Styles */
    #adminPanel {
      display: none;
      width: 100%;
      max-width: 900px;
      margin: 30px auto;
      background: #1e1e1e;
      padding: 2em;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      text-align: left;
    }

    #adminPanel h2 {
      font-size: 2.5em;
      margin-bottom: 1.5em;
      text-align: center;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-box {
      background: #333;
      padding: 1.5em;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .stat-box:hover {
      transform: scale(1.05);
    }

    .stat-box h3 {
      margin-bottom: 1em;
      color: #00bcd4;
      font-size: 1.4em;
    }

    .stat-box p {
      font-size: 1.3em;
      margin-top: 0.5em;
    }

    .user-list {
      background: #333;
      padding: 1.5em;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-top: 30px;
    }

    .user-list h3 {
      color: #00bcd4;
      margin-bottom: 1em;
      font-size: 1.6em;
    }

    .user-list table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5em;
    }

    .user-list table, th, td {
      border: 1px solid #444;
    }

    .user-list th, td {
      padding: 12px;
      text-align: center;
      font-size: 1.1em;
    }

    .user-list th {
      background: #444;
      color: #fff;
    }

    .user-list td {
      background: #222;
    }

    /* Button Styles */
    .logout-btn {
      margin-top: 30px;
      background: #e74c3c;
      color: white;
      padding: 0.8em 2em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1em;
      width: 100%;
      transition: background 0.3s ease;
    }

    .logout-btn:hover {
      background: #c0392b;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f172a; /* dark background */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      z-index: 9999;
    }

    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-top: 6px solid #38bdf8; /* Tailwind sky-400 */
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Admin Login Form -->
    <div id="loginForm">
      <h2>Admin Login</h2>
      <input type="text" id="username" placeholder="Username"><br>
      <input type="password" id="password" placeholder="Password"><br>
      <button onclick="login()">Login</button>
      <div id="error"></div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel">
      <h2>Admin Panel</h2>

    <div id="loading-screen">
      <div class="spinner"></div>
      <p>Redirecting, please wait...</p>
    </div>

      <!-- Stats Container -->
      <div class="stats-container">
        <div class="stat-box">
          <h3>Total Visits</h3>
          <p id="visitCount">0</p>
        </div>
        <div class="stat-box">
          <h3>Total Time Spent</h3>
          <p id="totalTimeSpent">0 seconds</p>
        </div>
        <div class="stat-box">
          <h3>Average Time Spent</h3>
          <p id="averageTime">0 seconds</p>
        </div>
      </div>

      <!-- User Activity List -->
      <div class="user-list">
        <h3>Recent Users' Activity</h3>
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Time Spent (Seconds)</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="userList">
            <!-- Dynamic content here -->
          </tbody>
        </table>
      </div>

      <!-- Logout Button -->
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="footer">
    <p>Powered by UM Technology</p>
  </div>

  <script>
    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "secret123"; // For Admin Panel access
    const REDIRECT_USERNAME = "admin";
    const REDIRECT_PASSWORD = "yourpassword"; // For redirect to logi.html

    window.onload = function() {
      if (sessionStorage.getItem("adminLoggedIn") === "true" && sessionStorage.getItem("password") === "secret123") {
        document.getElementById("adminPanel").style.display = "block";
        loadAdminStats();
      } else if (sessionStorage.getItem("adminLoggedIn") === "true" && sessionStorage.getItem("password") === "yourpassword") {
        window.location.href = "logi.html";
      } else {
        document.getElementById("loginForm").style.display = "block";
      }
    };

    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if (user === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
        sessionStorage.setItem("adminLoggedIn", "true");
        sessionStorage.setItem("password", "secret123");
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadAdminStats();
      } else if (user === REDIRECT_USERNAME && pass === REDIRECT_PASSWORD) {
        sessionStorage.setItem("adminLoggedIn", "true");
        sessionStorage.setItem("password", "yourpassword");
        window.location.href = "logi.html";
      } else {
        document.getElementById("error").textContent = "Incorrect username or password.";
      }
    }

    function logout() {
      sessionStorage.removeItem("adminLoggedIn");
      sessionStorage.removeItem("password");
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("adminPanel").style.display = "none";
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      document.getElementById("error").textContent = "";
    }

    function loadAdminStats() {
      const visits = parseInt(localStorage.getItem("visitCount") || "0");
      const totalTime = parseFloat(localStorage.getItem("totalTimeSpent") || "0");
      const averageTime = visits > 0 ? (totalTime / visits).toFixed(2) : 0;

      document.getElementById("visitCount").textContent = visits;
      document.getElementById("totalTimeSpent").textContent = totalTime.toFixed(2) + " seconds";
      document.getElementById("averageTime").textContent = averageTime + " seconds";

      const userList = document.getElementById("userList");
      const users = JSON.parse(localStorage.getItem("userActivity") || "[]");
      userList.innerHTML = "";
      users.forEach(user => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${user.name}</td>
          <td>${user.timeSpent}</td>
          <td>${new Date(user.date).toLocaleString()}</td>
        `;
        userList.appendChild(row);
      });
    }
  </script>

  <script>
    setTimeout(() => {
      window.location.href = 'https://your-redirect-url.com';
    }, 3000); // Show spinner for 3 seconds
  </script>

</body>
</html>
