<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - UM Technology</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #loginForm, #adminPanel {
      background: #1e1e1e;
      padding: 2em;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      width: 320px;
      text-align: center;
      z-index: 1;
    }

    h2 {
      color: #00bcd4;
      margin-bottom: 1em;
    }

    input {
      padding: 0.8em;
      width: 100%;
      margin: 0.5em 0;
      font-size: 1em;
      background: #333;
      border: 1px solid #444;
      border-radius: 5px;
      color: #fff;
    }

    input:focus {
      outline: none;
      border-color: #00bcd4;
    }

    button {
      background: #00bcd4;
      color: white;
      padding: 0.8em;
      border: none;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.1em;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #008c96;
    }

    #error {
      color: red;
      margin-top: 1em;
      font-size: 0.9em;
    }

    .footer {
      font-size: 0.8em;
      margin-top: 1.5em;
      color: #777;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-box {
      background: #333;
      padding: 1.5em;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .stat-box h3 {
      margin-bottom: 1em;
      color: #00bcd4;
    }

    .stat-box p {
      font-size: 1.2em;
    }

    .user-list {
      background: #333;
      padding: 1.5em;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      margin-top: 20px;
    }

    .user-list h3 {
      color: #00bcd4;
      margin-bottom: 1em;
    }

    .user-list table {
      width: 100%;
      border-collapse: collapse;
    }

    .user-list table, th, td {
      border: 1px solid #444;
    }

    .user-list th, td {
      padding: 12px;
      text-align: center;
    }

    .user-list th {
      background: #444;
    }

  </style>
</head>
<body>
  <div class="container">
    <!-- Admin Login Form -->
    <div id="loginForm" style="display: none;">
      <h2>Admin Login</h2>
      <input type="text" id="username" placeholder="Username"><br>
      <input type="password" id="password" placeholder="Password"><br>
      <button onclick="login()">Login</button>
      <div id="error"></div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" style="display:none;">
      <h2>Admin Panel</h2>

      <div class="stats-container">
        <div class="stat-box">
          <h3>Total Visits</h3>
          <p id="visitCount">0</p>
        </div>
        <div class="stat-box">
          <h3>Total Time Spent</h3>
          <p id="totalTimeSpent">0 seconds</p>
        </div>
        <div class="stat-box">
          <h3>Average Time Spent</h3>
          <p id="averageTime">0 seconds</p>
        </div>
      </div>

      <div class="user-list">
        <h3>Recent Users' Activity</h3>
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Time Spent (Seconds)</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="userList">
            <!-- Users will be dynamically populated here -->
          </tbody>
        </table>
      </div>

      <!-- Logout Button -->
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="footer">
    <p>Powered by UM Technology</p>
  </div>

  <script>
    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "yourpassword"; 

    // On page load, check if the user is already logged in
    window.onload = function() {
      if (sessionStorage.getItem("adminLoggedIn") === "true") {
        // If logged in, show the admin panel
        document.getElementById("adminPanel").style.display = "block";
        loadAdminStats();
      } else {
        // If not logged in, show the login form
        document.getElementById("loginForm").style.display = "block";
      }
    };

    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if (user === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
        // Store session info that the user is logged in
        sessionStorage.setItem("adminLoggedIn", "true");

        // Hide login form and show admin panel
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";

        // Load stats
        loadAdminStats();
      } else {
        document.getElementById("error").textContent = "Incorrect username or password.";
      }
    }

    // Logout function
    function logout() {
      // Clear session storage for logout
      sessionStorage.removeItem("adminLoggedIn");

      // Show the login form and hide the admin panel
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("adminPanel").style.display = "none";

      // Clear the form
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      document.getElementById("error").textContent = "";
    }

    // Load stats for admin panel
    function loadAdminStats() {
      const visits = parseInt(localStorage.getItem("visitCount") || "0");
      const totalTime = parseFloat(localStorage.getItem("totalTimeSpent") || "0");
      const averageTime = visits > 0 ? (totalTime / visits).toFixed(2) : 0;

      // Display the stats
      document.getElementById("visitCount").textContent = visits;
      document.getElementById("totalTimeSpent").textContent = totalTime.toFixed(2) + " seconds";
      document.getElementById("averageTime").textContent = averageTime + " seconds";

      // Display the user activity
      const userList = document.getElementById("userList");
      const users = JSON.parse(localStorage.getItem("userActivity") || "[]");
      userList.innerHTML = ""; // Clear the previous list
      users.forEach(user => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${user.name}</td>
          <td>${user.timeSpent}</td>
          <td>${new Date(user.date).toLocaleString()}</td>
        `;
        userList.appendChild(row);
      });
    }
  </script>
</body>
</html>
