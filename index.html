<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - UM Technology</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #adminPanel {
      background: #1e1e1e;
      padding: 2em;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      width: 80%;
      max-width: 1000px;
      text-align: center;
    }

    h2 {
      color: #00bcd4;
      margin-bottom: 1em;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-box {
      background: #333;
      padding: 1.5em;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .stat-box h3 {
      margin-bottom: 1em;
      color: #00bcd4;
    }

    .stat-box p {
      font-size: 1.2em;
    }

    .user-list {
      background: #333;
      padding: 1.5em;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      margin-top: 20px;
    }

    .user-list h3 {
      color: #00bcd4;
      margin-bottom: 1em;
    }

    .user-list table {
      width: 100%;
      border-collapse: collapse;
    }

    .user-list table, th, td {
      border: 1px solid #444;
    }

    .user-list th, td {
      padding: 12px;
      text-align: center;
    }

    .user-list th {
      background: #444;
    }

    .footer {
      font-size: 0.8em;
      margin-top: 2em;
      color: #777;
    }

    button {
      background: #00bcd4;
      color: white;
      padding: 0.8em 1.5em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s ease;
      margin-top: 20px;
    }

    button:hover {
      background: #008c96;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="adminPanel">
      <h2>Admin Panel</h2>

      <div class="stats-container">
        <div class="stat-box">
          <h3>Total Visits</h3>
          <p id="visitCount">0</p>
        </div>
        <div class="stat-box">
          <h3>Total Time Spent</h3>
          <p id="totalTimeSpent">0 seconds</p>
        </div>
        <div class="stat-box">
          <h3>Average Time Spent</h3>
          <p id="averageTime">0 seconds</p>
        </div>
      </div>

      <div class="user-list">
        <h3>Recent Users' Activity</h3>
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Time Spent (Seconds)</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="userList">
            <!-- Users will be dynamically populated here -->
          </tbody>
        </table>
      </div>

      <!-- Logout Button -->
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="footer">
    <p>Powered by UM Technology</p>
  </div>

  <script>
    let pageStartTime;
    let pageEndTime;

    // When the page is loaded, we start tracking the time
    window.addEventListener("load", () => {
      pageStartTime = performance.now();
    });

    // When the page is unloaded (user leaves or refreshes), we calculate the time spent
    window.addEventListener("beforeunload", () => {
      pageEndTime = performance.now();
      const timeSpent = ((pageEndTime - pageStartTime) / 1000).toFixed(2); // Time spent in seconds

      // Save to localStorage
      let visits = parseInt(localStorage.getItem("visitCount") || "0") + 1;
      let totalTime = parseFloat(localStorage.getItem("totalTimeSpent") || "0") + parseFloat(timeSpent);
      localStorage.setItem("visitCount", visits);
      localStorage.setItem("totalTimeSpent", totalTime);
      
      // Save user data (simulating user activity)
      let userActivity = JSON.parse(localStorage.getItem("userActivity") || "[]");
      userActivity.push({
        name: `User ${visits}`,
        timeSpent: timeSpent,
        date: new Date().toISOString()
      });
      localStorage.setItem("userActivity", JSON.stringify(userActivity));
    });

    // On page load (for the admin panel), we retrieve the data
    window.addEventListener("DOMContentLoaded", () => {
      const visits = parseInt(localStorage.getItem("visitCount") || "0");
      const totalTime = parseFloat(localStorage.getItem("totalTimeSpent") || "0");
      const averageTime = visits > 0 ? (totalTime / visits).toFixed(2) : 0;

      // Display the stats
      document.getElementById("visitCount").textContent = visits;
      document.getElementById("totalTimeSpent").textContent = totalTime.toFixed(2) + " seconds";
      document.getElementById("averageTime").textContent = averageTime + " seconds";

      // Display the user activity
      const userList = document.getElementById("userList");
      const users = JSON.parse(localStorage.getItem("userActivity") || "[]");
      users.forEach(user => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${user.name}</td>
          <td>${user.timeSpent}</td>
          <td>${new Date(user.date).toLocaleString()}</td>
        `;
        userList.appendChild(row);
      });
    });

    // Logout function
    function logout() {
      // Clear any session-specific data (like stored time, visits, etc.)
      localStorage.removeItem("visitCount");
      localStorage.removeItem("totalTimeSpent");
      localStorage.removeItem("userActivity");

      // Redirect back to the login page
      window.location.href = "index.html";  // Change this URL if necessary
    }
  </script>
</body>
</html>
